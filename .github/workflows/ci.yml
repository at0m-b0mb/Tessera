name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (py${{ matrix.python }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install cryptography rich qrcode

      - name: Import check
        run: python -c "import tessera, tessera.core.manager, tessera.cli.main; print(tessera.__version__)"

      - name: Lifecycle tests
        run: python tests/test_lifecycle.py

      - name: CLI smoke test against the simulated server
        run: |
          python -m tessera --version
          python -m tessera doctor demo
          python -m tessera install demo --yes --engine wireguard --dry-run
          python -m tessera install demo --yes -e wireguard -e openvpn --no-qr -o ./out
          python -m tessera status demo
          python -m tessera audit demo || true
          python -m tessera uninstall demo --dry-run

      - name: Generated configs must not be empty
        shell: bash
        run: |
          test -s ./out/wireguard-laptop.conf
          test -s ./out/openvpn-laptop.ovpn
          grep -q '^\[Interface\]' ./out/wireguard-laptop.conf
          grep -q 'PrivateKey' ./out/wireguard-laptop.conf
          grep -q '<ca>' ./out/openvpn-laptop.ovpn

  gui:
    name: gui (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0
          python -m pip install --upgrade pip
          pip install cryptography rich qrcode PyQt6
      - name: Render the GUI offscreen
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/screenshots.py /tmp/shots
      - name: Every screenshot must exist and be non-trivial
        run: |
          ls -l /tmp/shots
          for f in /tmp/shots/*.png; do
            size=$(stat -c%s "$f")
            echo "$f: $size bytes"
            test "$size" -gt 8000 || { echo "suspiciously small: $f"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: /tmp/shots

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check tessera/ --output-format=github
        continue-on-error: true

  py39-compat:
    name: python 3.9 syntax compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Compile every module under 3.9
        run: python -m compileall -q tessera/ scripts/ tests/
